<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技新闻 · 每日科技头条</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; background: #f7f3ea; color: #1a1a1a; line-height: 1.6; }
  a { color: inherit; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 60px; }

  /* 报头 */
  header { text-align: center; padding: 28px 0 12px; border-bottom: 3px double #1a1a1a; }
  header h1 { font-size: 44px; letter-spacing: 10px; font-weight: 900; }
  header .sub { margin-top: 6px; font-size: 14px; color: #666; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
  header .sub b { color: #b03a2e; }

  /* 工具条 */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid #ccc; }
  .toolbar input[type="search"] { flex: 1; min-width: 160px; padding: 9px 12px; font-size: 15px; border: 1px solid #999; border-radius: 4px; background: #fff; font-family: inherit; }
  .toolbar button { padding: 9px 16px; font-size: 15px; border: 1px solid #1a1a1a; background: #1a1a1a; color: #fff; border-radius: 4px; cursor: pointer; font-family: inherit; }
  .toolbar button:hover { background: #b03a2e; border-color: #b03a2e; }
  .updated { font-size: 13px; color: #888; }

  /* 分类 */
  nav.cats { display: flex; gap: 8px; padding: 12px 0; overflow-x: auto; border-bottom: 1px solid #ccc; }
  nav.cats button { flex: 0 0 auto; padding: 7px 16px; font-size: 15px; border: 1px solid #999; border-radius: 20px; background: #fff; cursor: pointer; font-family: inherit; }
  nav.cats button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* 文章列表 */
  #list { list-style: none; }
  #list li { padding: 18px 0; border-bottom: 1px solid #ddd; }
  .item { display: flex; gap: 14px; }
  .item .txt { flex: 1; min-width: 0; }
  .item h2 { font-size: 19px; line-height: 1.45; cursor: pointer; }
  .item h2:hover { color: #b03a2e; }
  .meta { font-size: 13px; color: #888; margin: 5px 0 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta .src { color: #b03a2e; font-weight: bold; }
  .meta .cat { border: 1px solid #b03a2e; color: #b03a2e; border-radius: 3px; padding: 0 5px; }
  .summary { font-size: 15px; color: #444; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .thumb { width: 120px; height: 84px; object-fit: cover; border-radius: 4px; flex: 0 0 auto; }
  .detail { display: none; margin-top: 10px; padding: 12px; background: #fff; border: 1px solid #e0d9c8; border-radius: 6px; font-size: 15px; color: #333; white-space: pre-wrap; word-break: break-word; }
  .detail.open { display: block; }
  .detail a.orig { display: inline-block; margin-top: 10px; color: #b03a2e; font-weight: bold; }
  .status { text-align: center; padding: 30px 0; color: #888; font-size: 15px; }
  .count { font-size: 13px; color: #888; padding: 10px 0 0; }
  footer { text-align: center; color: #aaa; font-size: 13px; padding: 24px 0 0; }

  @media (max-width: 600px) {
    header h1 { font-size: 30px; letter-spacing: 6px; }
    .item h2 { font-size: 17px; }
    .thumb { width: 96px; height: 68px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>科 技 新 闻</h1>
    <div class="sub">
      <span id="today"></span>
      <span>来源：IT之家 · 爱范儿 · 雷峰网 · 极客公园 · 少数派</span>
      <span>共 <b id="total">0</b> 篇</span>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索标题或内容…" aria-label="搜索">
    <button id="searchBtn">搜索</button>
    <button id="refreshBtn">🔄 手动刷新</button>
    <span class="updated" id="updated"></span>
  </div>

  <nav class="cats" id="cats">
    <button data-cat="全部" class="active">全部</button>
    <button data-cat="AI">AI</button>
    <button data-cat="手机数码">手机数码</button>
    <button data-cat="汽车">汽车</button>
    <button data-cat="互联网">互联网</button>
    <button data-cat="其他">其他</button>
  </nav>

  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="status" id="status">正在加载新闻…</div>

  <footer>内容来自各来源公开 RSS，版权归原作者所有 · 点击标题展开摘要，点“阅读原文”跳转来源网站</footer>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  let curCat = '全部';
  let curQ = '';

  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function loadNews() {
    $('#status').textContent = '正在加载新闻…';
    $('#status').style.display = 'block';
    try {
      const params = new URLSearchParams();
      if (curCat !== '全部') params.set('category', curCat);
      if (curQ) params.set('q', curQ);
      const res = await fetch('/api/news?' + params.toString());
      const data = await res.json();
      $('#total').textContent = data.count;
      $('#updated').textContent = data.updatedAt ? '上次更新：' + fmtTime(data.updatedAt) : '尚未更新';
      render(data.articles);
    } catch (e) {
      $('#status').textContent = '加载失败，请点“手动刷新”重试。';
    }
  }

  function render(articles) {
    const list = $('#list');
    list.innerHTML = '';
    $('#count').textContent = articles.length ? `共 ${articles.length} 篇` : '';
    if (!articles.length) {
      $('#status').textContent = '没有找到相关文章，换个关键词试试。';
      $('#status').style.display = 'block';
      return;
    }
    $('#status').style.display = 'none';
    articles.forEach((a) => {
      const li = document.createElement('li');
      const img = a.image ? `<img class="thumb" src="${esc(a.image)}" alt="" loading="lazy" onerror="this.remove()">` : '';
      li.innerHTML = `
        <div class="item">
          <div class="txt">
            <h2>${esc(a.title)}</h2>
            <div class="meta">
              <span class="src">${esc(a.source)}</span>
              <span class="cat">${esc(a.category)}</span>
              <span>${fmtTime(a.pubDate)}</span>
            </div>
            <div class="summary">${esc(a.summary || '')}</div>
            <div class="detail">${esc(a.summary || '（该来源未提供摘要）')}<br><a class="orig" href="${esc(a.link)}" target="_blank" rel="noopener">阅读原文 →</a></div>
          </div>
          ${img}
        </div>`;
      li.querySelector('h2').addEventListener('click', () => {
        li.querySelector('.detail').classList.toggle('open');
      });
      list.appendChild(li);
    });
  }

  document.querySelectorAll('#cats button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#cats button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      curCat = btn.dataset.cat;
      loadNews();
    });
  });

  function doSearch() { curQ = $('#q').value.trim(); loadNews(); }
  $('#searchBtn').addEventListener('click', doSearch);
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  $('#refreshBtn').addEventListener('click', async () => {
    $('#refreshBtn').textContent = '刷新中…';
    try { await fetch('/api/refresh', { method: 'POST' }); } catch (e) {}
    setTimeout(() => { $('#refreshBtn').textContent = '🔄 手动刷新'; loadNews(); }, 3000);
  });

  $('#today').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  loadNews();
  setInterval(loadNews, 5 * 60 * 1000); // 前端每 5 分钟自动刷新列表
</script>
</body>
</html>
